<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72">
  <defs>
    <linearGradient id="sedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .mono { font-family: 'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .vscan { animation: vscan 8s ease-in-out infinite; }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
      @keyframes vscan { 0% {transform:translateX(0);opacity:0} 10% {opacity:.35} 50% {transform:translateX(1120px);opacity:.35} 60%,100% {transform:translateX(1120px);opacity:0} }
    ]]></style>
    <filter id="sglow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect x="10" y="8" width="1180" height="56" rx="8" fill="#070A12" fill-opacity="0.92" stroke="#1F2A37" stroke-width="1"/>
  <rect x="10" y="8" width="1180" height="2" rx="1" fill="url(#sedge)" opacity="0.7"/>

  <!-- terminal prompt -->
  <text class="mono" x="30" y="42" font-size="13" fill="#00F5FF">manik@dev:~$</text>
  <text class="mono" x="142" y="42" font-size="13" fill="#5C6773">status --live</text>
  <rect class="blink" x="250" y="32" width="7" height="14" fill="#00F5FF" opacity="0.9"/>

  <!-- metric chips -->
  <g>
    <rect x="280" y="20" width="130" height="32" rx="6" fill="#0A0E1A" stroke="#233146" stroke-width="1"/>
    <text class="mono" x="294" y="41" font-size="9.5" fill="#5C6773" letter-spacing="1.5">VIEWS</text>
    <text class="mono" x="396" y="42" font-size="14" font-weight="700" fill="#00F5FF" text-anchor="end">{{VIEWS}}</text>
  </g>
  <g>
    <rect x="422" y="20" width="150" height="32" rx="6" fill="#0A0E1A" stroke="#233146" stroke-width="1"/>
    <text class="mono" x="436" y="41" font-size="9.5" fill="#5C6773" letter-spacing="1.5">FOLLOWERS</text>
    <text class="mono" x="558" y="42" font-size="14" font-weight="700" fill="#FF6CF0" text-anchor="end">{{FOLLOWERS}}</text>
  </g>
  <g>
    <rect x="584" y="20" width="115" height="32" rx="6" fill="#0A0E1A" stroke="#233146" stroke-width="1"/>
    <text class="mono" x="598" y="41" font-size="9.5" fill="#5C6773" letter-spacing="1.5">STARS</text>
    <text class="mono" x="685" y="42" font-size="14" font-weight="700" fill="#FFD700" text-anchor="end">{{STARS}}</text>
  </g>
  <g>
    <rect x="711" y="20" width="125" height="32" rx="6" fill="#0A0E1A" stroke="#233146" stroke-width="1"/>
    <text class="mono" x="725" y="41" font-size="9.5" fill="#5C6773" letter-spacing="1.5">REPOS</text>
    <text class="mono" x="822" y="42" font-size="14" font-weight="700" fill="#00F5FF" text-anchor="end">{{REPOS}}</text>
  </g>

  <!-- status + location -->
  <circle class="pulse" cx="870" cy="36" r="4.5" fill="#39FF14" filter="url(#sglow)"/>
  <text class="mono" x="884" y="41" font-size="12.5" fill="#39FF14" letter-spacing="1.5">OPEN TO WORK</text>

  <line x1="1015" y1="22" x2="1015" y2="50" stroke="#1F2A37" stroke-width="1"/>
  <text class="mono" x="1180" y="41" font-size="12" fill="#FF6CF0" letter-spacing="1" text-anchor="end">NAVI MUMBAI, IN</text>

  <!-- vertical scan sweep -->
  <rect class="vscan" x="14" y="12" width="2" height="48" fill="#00F5FF" opacity="0"/>
</svg>
