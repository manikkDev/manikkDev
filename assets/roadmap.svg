<svg xmlns="http://www.w3.org/2000/svg" width="940" height="392" viewBox="0 0 940 392">
  <defs>
    <linearGradient id="redge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F5FF" stop-opacity="0"/><stop offset="0.5" stop-color="#39FF14" stop-opacity="0.8"/><stop offset="1" stop-color="#FF00FF" stop-opacity="0"/></linearGradient>
    <linearGradient id="rsweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F5FF" stop-opacity="0"/><stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.10"/><stop offset="1" stop-color="#00F5FF" stop-opacity="0"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39FF14" stop-opacity="0.7"/><stop offset="1" stop-color="#FFD700" stop-opacity="0.4"/></linearGradient>
    <filter id="rglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style><![CDATA[
      .mono {font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace;}
      .rowin {animation:rin .5s ease-out backwards;}
      .pnode {animation:npulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
      .pulse {animation:p 2.2s ease-in-out infinite;}
      .sweep {animation:swx 13s linear infinite;}
      .run   {animation:rux 8s linear infinite;}
      @keyframes rin {0% {opacity:0;transform:translateX(-14px)} 100% {opacity:1;transform:translateX(0)}}
      @keyframes npulse {0%,100% {transform:scale(1);opacity:1} 50% {transform:scale(1.5);opacity:.5}}
      @keyframes p   {0%,100% {opacity:1} 50% {opacity:.3}}
      @keyframes swx {0% {transform:translateX(0);opacity:0} 10% {opacity:1} 90% {opacity:1} 100% {transform:translateX(900px);opacity:0}}
      @keyframes rux {0% {transform:translateX(-8px);opacity:0} 12% {opacity:.9} 88% {opacity:.9} 100% {transform:translateX(900px);opacity:0}}
    ]]></style>
  </defs>
  <rect x="8" y="8" width="924" height="376" rx="12" fill="#070A12" stroke="#1F2A37" stroke-width="1"/>
