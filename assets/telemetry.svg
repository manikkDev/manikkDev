<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330">
  <defs>
    <linearGradient id="tedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tglow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style><![CDATA[
      .mono  { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .boot  { animation: boot .5s ease-out backwards; }
      .seg   { animation: seg .45s cubic-bezier(.2,.8,.3,1) backwards; transform-box: fill-box; transform-origin: left center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .flame { animation: flame 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .run   { animation: run 8s linear infinite; }
      @keyframes boot  { 0% {opacity:0;transform:translateY(6px)} 100% {opacity:1;transform:translateY(0)} }
      @keyframes seg   { 0% {opacity:0;transform:scaleX(0)} 100% {opacity:1;transform:scaleX(1)} }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
      @keyframes flame { 0%,100% {transform:scale(1)} 50% {transform:scale(1.25)} }
      @keyframes run   { 0% {transform:translateX(-8px);opacity:0} 12% {opacity:.9} 88% {opacity:.9} 100% {transform:translateX(900px);opacity:0} }
    ]]></style>
  </defs>

