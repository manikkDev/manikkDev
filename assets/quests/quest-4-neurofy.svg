<svg xmlns="http://www.w3.org/2000/svg" width="440" height="272" viewBox="0 0 440 272">
  <defs>
    <linearGradient id="qe3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <filter id="qg3" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style><![CDATA[
      .mono { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .boot { animation: boot .5s cubic-bezier(.2,.8,.3,1) backwards; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .scanY { animation: scanY 9s linear infinite; animation-delay: 6.6000000000000005s; }
      .run   { animation: run 7s linear infinite; animation-delay: 4.199999999999999s; }
      @keyframes boot  { 0% {opacity:0;transform:translateY(8px)} 100% {opacity:1;transform:translateY(0)} }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
      @keyframes scanY { 0% {transform:translateY(-30px);opacity:0} 10% {opacity:.09} 90% {opacity:.09} 100% {transform:translateY(300px);opacity:0} }
      @keyframes run   { 0% {transform:translateX(-6px);opacity:0} 15% {opacity:.9} 85% {opacity:.9} 100% {transform:translateX(415px);opacity:0} }
    ]]></style>
  </defs>

  <g class="boot" style="animation-delay:0.36s">
  <rect x="4" y="4" width="432" height="264" rx="11" fill="#0A0E1A" stroke="#1F2A37" stroke-width="1"/>
  <rect x="4" y="4" width="160" height="2.5" rx="1.2" fill="url(#qe3)"/>
  <g stroke="#39FF14" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M12 22 V12 H22"/>
    <path d="M418 12 H428 V22"/>
  </g>

  <rect x="334" y="16" width="86" height="22" rx="11" fill="#0D1424" stroke="#00F5FF" stroke-opacity="0.6"/>
  <circle class="pulse" cx="347" cy="27" r="3.6" fill="#00F5FF" filter="url(#qg3)"/>
  <text class="mono" x="358" y="31" font-size="11.5" fill="#00F5FF" letter-spacing="1.5" font-weight="700">SHIPPED</text>

  <text class="mono" x="22" y="66" font-size="23" font-weight="800" fill="#39FF14" letter-spacing="1">NEUROFY</text>

  <text class="mono" x="22" y="92" font-size="12.5" fill="#93A4BC">Tremor-monitoring platform with patient</text>
  <text class="mono" x="22" y="110" font-size="12.5" fill="#93A4BC">and doctor dashboards.</text>

  <rect x="22" y="124" width="50" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="30" y="139.5" font-size="10.5" fill="#39FF14" letter-spacing="0.6">REACT</text>
  <rect x="79" y="124" width="84" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="87" y="139.5" font-size="10.5" fill="#39FF14" letter-spacing="0.6">TYPESCRIPT</text>
  <rect x="170" y="124" width="43" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="178" y="139.5" font-size="10.5" fill="#39FF14" letter-spacing="0.6">VITE</text>
  <rect x="220" y="124" width="64" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="228" y="139.5" font-size="10.5" fill="#39FF14" letter-spacing="0.6">NODE.JS</text>
  <line x1="22" y1="160" x2="418" y2="160" stroke="#141B2B" stroke-width="1"/>

  <text class="mono" x="22" y="182" font-size="12.5" fill="#39FF14" font-weight="700">&gt;</text>
  <text class="mono" x="40" y="182" font-size="12" fill="#C9D1D9">Role-based routing: patients, clinicians</text>
  <text class="mono" x="22" y="205" font-size="12.5" fill="#39FF14" font-weight="700">&gt;</text>
  <text class="mono" x="40" y="205" font-size="12" fill="#C9D1D9">Feature modules: React Query + sockets</text>
  <text class="mono" x="22" y="228" font-size="12.5" fill="#39FF14" font-weight="700">&gt;</text>
  <text class="mono" x="40" y="228" font-size="12" fill="#C9D1D9">Companion API: neurofy-backend</text>

  <line x1="22" y1="240" x2="418" y2="240" stroke="#141B2B" stroke-width="1"/>
  <circle cx="29" cy="255" r="4.5" fill="#3178C6"/>
  <text class="mono" x="40" y="259.5" font-size="12" fill="#93A4BC" letter-spacing="1.2">TYPESCRIPT</text>
  <text class="mono" x="418" y="259.5" font-size="11" fill="#5C6773" text-anchor="end">manikkDev/neurofy-frontend <tspan fill="#39FF14">&#8594;</tspan></text>

  <rect class="scanY" x="4" y="0" width="432" height="12" fill="#39FF14" opacity="0"/>
  <circle class="run" cx="6" cy="5" r="2" fill="#39FF14" filter="url(#qg3)"/>
  </g>
</svg>
