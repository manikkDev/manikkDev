<svg xmlns="http://www.w3.org/2000/svg" width="585" height="250" viewBox="0 0 585 250">
  <defs>
    <linearGradient id="qe2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <filter id="qg2" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style><![CDATA[
      .mono { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .boot { animation: boot .5s cubic-bezier(.2,.8,.3,1) backwards; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .scanY { animation: scanY 9s linear infinite; animation-delay: 4.4s; }
      .run   { animation: run 7s linear infinite; animation-delay: 2.8s; }
      @keyframes boot  { 0% {opacity:0;transform:translateY(8px)} 100% {opacity:1;transform:translateY(0)} }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
      @keyframes scanY { 0% {transform:translateY(-30px);opacity:0} 10% {opacity:.09} 90% {opacity:.09} 100% {transform:translateY(280px);opacity:0} }
      @keyframes run   { 0% {transform:translateX(-6px);opacity:0} 15% {opacity:.9} 85% {opacity:.9} 100% {transform:translateX(560px);opacity:0} }
    ]]></style>
  </defs>

  <g class="boot" style="animation-delay:0.24s">
  <rect x="4" y="4" width="577" height="242" rx="11" fill="#0A0E1A" stroke="#1F2A37" stroke-width="1"/>
  <rect x="4" y="4" width="200" height="2.5" rx="1.2" fill="url(#qe2)"/>
  <g stroke="#FFD700" stroke-width="1.3" fill="none" opacity="0.8">
    <path d="M12 20 V12 H20"/>
    <path d="M565 12 H573 V20"/>
  </g>

  <!-- header: quest id + status -->
  <text class="mono" x="22" y="34" font-size="10.5" fill="#5C6773" letter-spacing="2.5">QUEST_03 //</text>
  <rect x="92" y="24" width="68.19999999999999" height="15" rx="7.5" fill="#0D1424" stroke="#00F5FF" stroke-opacity="0.6"/>
  <circle class="pulse" cx="103" cy="31.5" r="2.8" fill="#00F5FF" filter="url(#qg2)"/>
  <text class="mono" x="111" y="34.5" font-size="8.5" fill="#00F5FF" letter-spacing="1.5" font-weight="700">SHIPPED</text>

  <!-- name -->
  <text class="mono" x="22" y="66" font-size="20" font-weight="800" fill="#FFD700" letter-spacing="1.5">PORTFOLIO WEB</text>

  <!-- description -->
  <text class="mono" x="22" y="92" font-size="11" fill="#93A4BC">Gamified portfolio — a cyberpunk HUD built as</text>
  <text class="mono" x="22" y="108" font-size="11" fill="#93A4BC">a product, not a template.</text>

  <!-- tech chips -->
  <rect x="22" y="120" width="65" height="19" rx="4" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="29" y="133" font-size="9.5" fill="#FFD700" letter-spacing="0.8">REACT 19</text>
  <rect x="94.2" y="120" width="52" height="19" rx="4" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="101.2" y="133" font-size="9.5" fill="#FFD700" letter-spacing="0.8">VITE 7</text>
  <rect x="153.60000000000002" y="120" width="97" height="19" rx="4" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="160.60000000000002" y="133" font-size="9.5" fill="#FFD700" letter-spacing="0.8">FRAMER MOTION</text>
  <rect x="257.8" y="120" width="65" height="19" rx="4" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="264.8" y="133" font-size="9.5" fill="#FFD700" letter-spacing="0.8">THREE.JS</text>
  <line x1="22" y1="152" x2="563" y2="152" stroke="#141B2B" stroke-width="1"/>

  <!-- feats -->
  <text class="mono" x="22" y="172" font-size="11" fill="#FFD700" font-weight="700">&gt;</text>
  <text class="mono" x="38" y="172" font-size="10.8" fill="#C9D1D9">Terminal hero, XP bars, crosshair cursor, circuit backgrounds</text>
  <text class="mono" x="22" y="191" font-size="11" fill="#FFD700" font-weight="700">&gt;</text>
  <text class="mono" x="38" y="191" font-size="10.8" fill="#C9D1D9">Lazy-loaded sections, code-splitting, reduced-motion support</text>
  <text class="mono" x="22" y="210" font-size="11" fill="#FFD700" font-weight="700">&gt;</text>
  <text class="mono" x="38" y="210" font-size="10.8" fill="#C9D1D9">Connected contact, ratings, YouTube cache, LinkedIn feed</text>

  <!-- footer -->
  <line x1="22" y1="222" x2="563" y2="222" stroke="#141B2B" stroke-width="1"/>
  <circle cx="28" cy="235" r="4" fill="#A074C4"/>
  <text class="mono" x="38" y="239" font-size="10.5" fill="#93A4BC" letter-spacing="1.5">CSS</text>
  <text class="mono" x="563" y="239" font-size="10" fill="#5C6773" text-anchor="end">manikkDev/portfolio-web-frontend <tspan fill="#FFD700">&#8594;</tspan></text>

  <!-- interior scan line -->
  <rect class="scanY" x="4" y="0" width="577" height="16" fill="#FFD700" opacity="0"/>
  <circle class="run" cx="6" cy="5" r="2" fill="#FFD700" filter="url(#qg2)"/>
  </g>
</svg>
