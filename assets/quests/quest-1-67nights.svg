<svg xmlns="http://www.w3.org/2000/svg" width="440" height="272" viewBox="0 0 440 272">
  <defs>
    <linearGradient id="qe0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="qg0" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style><![CDATA[
      .mono { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .boot { animation: boot .5s cubic-bezier(.2,.8,.3,1) backwards; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .scanY { animation: scanY 9s linear infinite; animation-delay: 0.0s; }
      .run   { animation: run 7s linear infinite; animation-delay: 0.0s; }
      @keyframes boot  { 0% {opacity:0;transform:translateY(8px)} 100% {opacity:1;transform:translateY(0)} }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
      @keyframes scanY { 0% {transform:translateY(-30px);opacity:0} 10% {opacity:.09} 90% {opacity:.09} 100% {transform:translateY(300px);opacity:0} }
      @keyframes run   { 0% {transform:translateX(-6px);opacity:0} 15% {opacity:.9} 85% {opacity:.9} 100% {transform:translateX(415px);opacity:0} }
    ]]></style>
  </defs>

  <g class="boot" style="animation-delay:0.00s">
  <rect x="4" y="4" width="432" height="264" rx="11" fill="#0A0E1A" stroke="#1F2A37" stroke-width="1"/>
  <rect x="4" y="4" width="160" height="2.5" rx="1.2" fill="url(#qe0)"/>
  <g stroke="#00F5FF" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M12 22 V12 H22"/>
    <path d="M418 12 H428 V22"/>
  </g>

  <rect x="310" y="16" width="110" height="22" rx="11" fill="#0D1424" stroke="#39FF14" stroke-opacity="0.6"/>
