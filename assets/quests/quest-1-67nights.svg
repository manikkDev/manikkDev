  <text class="mono" x="334" y="31" font-size="11.5" fill="#39FF14" letter-spacing="1.5" font-weight="700">ACTIVE_DEV</text>

  <text class="mono" x="22" y="66" font-size="23" font-weight="800" fill="#00F5FF" letter-spacing="1">67 NIGHTS IN THE FOREST</text>

  <text class="mono" x="22" y="92" font-size="12.5" fill="#93A4BC">Multiplayer survival on Roblox — endure 67</text>
  <text class="mono" x="22" y="110" font-size="12.5" fill="#93A4BC">escalating nights in a hostile forest.</text>

  <rect x="22" y="124" width="43" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="30" y="139.5" font-size="10.5" fill="#00F5FF" letter-spacing="0.6">LUAU</text>
  <rect x="72" y="124" width="43" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="80" y="139.5" font-size="10.5" fill="#00F5FF" letter-spacing="0.6">ROJO</text>
  <rect x="122" y="124" width="43" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="130" y="139.5" font-size="10.5" fill="#00F5FF" letter-spacing="0.6">KNIT</text>
  <rect x="173" y="124" width="111" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="181" y="139.5" font-size="10.5" fill="#00F5FF" letter-spacing="0.6">PROFILESERVICE</text>
  <rect x="291" y="124" width="50" height="22" rx="5" fill="#0D1424" stroke="#233146"/>
  <text class="mono" x="299" y="139.5" font-size="10.5" fill="#00F5FF" letter-spacing="0.6">WALLY</text>
  <line x1="22" y1="160" x2="418" y2="160" stroke="#141B2B" stroke-width="1"/>

  <text class="mono" x="22" y="182" font-size="12.5" fill="#00F5FF" font-weight="700">&gt;</text>
  <text class="mono" x="40" y="182" font-size="12" fill="#C9D1D9">Server-auth Knit services: combat, loot, rescue</text>
  <text class="mono" x="22" y="205" font-size="12.5" fill="#00F5FF" font-weight="700">&gt;</text>
  <text class="mono" x="40" y="205" font-size="12" fill="#C9D1D9">ProfileService DataStore persistence</text>
  <text class="mono" x="22" y="228" font-size="12.5" fill="#00F5FF" font-weight="700">&gt;</text>
  <text class="mono" x="40" y="228" font-size="12" fill="#C9D1D9">Day/night cycle, NPC enemies, procs VFX</text>

  <line x1="22" y1="240" x2="418" y2="240" stroke="#141B2B" stroke-width="1"/>
  <circle cx="29" cy="255" r="4.5" fill="#00A2FF"/>
  <text class="mono" x="40" y="259.5" font-size="12" fill="#93A4BC" letter-spacing="1.2">LUAU</text>
  <text class="mono" x="418" y="259.5" font-size="11" fill="#5C6773" text-anchor="end">manikkDev/67-nights-in-the-forest <tspan fill="#00F5FF">&#8594;</tspan></text>

  <rect class="scanY" x="4" y="0" width="432" height="12" fill="#00F5FF" opacity="0"/>
  <circle class="run" cx="6" cy="5" r="2" fill="#00F5FF" filter="url(#qg0)"/>
  </g>
</svg>
