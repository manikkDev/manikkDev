<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <title>Manikaraj Anburaj — Game Developer · Full-Stack Engineer</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050B"/>
      <stop offset="0.55" stop-color="#0A0816"/>
      <stop offset="1" stop-color="#05060C"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.78" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMag" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#FF00FF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#BFEFFF"/>
      <stop offset="1" stop-color="#35D6FF"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset="0.55" stop-color="#FF00FF"/>
      <stop offset="1" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="xpGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>
    <pattern id="microgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#00F5FF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="nameGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="dotGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="320"/>
    </clipPath>
    <style><![CDATA[
      .mono { font-family: 'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .blink   { animation: blink 1.1s steps(1) infinite; }
      .scan    { animation: scan 7s linear infinite; }
      .sweep   { animation: sweep 9s ease-in-out infinite; }
      .dotrun  { animation: dotrun 5.5s linear infinite; }
      .spin    { animation: spin 6s linear infinite; transform-origin: 878px 88px; }
      .pulse   { animation: pulse 2.2s ease-in-out infinite; }
      .xpfill  { animation: xp 7s ease-in-out infinite; transform-origin: 895px 196px; transform-box: view-box; }
      .floorln { animation: floorln 4.5s linear infinite; }
      .breathe { animation: breathe 4s ease-in-out infinite; }
      .gc      { animation: glitchC 6s infinite steps(1); }
      .gm      { animation: glitchM 6s infinite steps(1); }
      .pt      { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; opacity: 0; }
      @keyframes blink   { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes scan    { 0% {transform:translateY(-10px);opacity:0} 6% {opacity:.5} 94% {opacity:.5} 100% {transform:translateY(330px);opacity:0} }
      @keyframes sweep   { 0% {transform:translateX(-180px) skewX(-18deg)} 38% {transform:translateX(1340px) skewX(-18deg)} 100% {transform:translateX(1340px) skewX(-18deg)} }
      @keyframes dotrun  { 0% {transform:translateX(0);opacity:0} 8% {opacity:1} 92% {opacity:1} 100% {transform:translateX(624px);opacity:0} }
      @keyframes spin    { to {transform:rotate(360deg)} }
      @keyframes pulse   { 0%,100% {opacity:1} 50% {opacity:.3} }
      @keyframes xp      { 0% {transform:scaleX(0)} 55% {transform:scaleX(.87)} 80% {transform:scaleX(.87)} 92% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
      @keyframes floorln { 0% {transform:translateY(0);opacity:0} 15% {opacity:.55} 85% {opacity:.15} 100% {transform:translateY(112px);opacity:0} }
      @keyframes breathe { 0%,100% {opacity:.15} 50% {opacity:.35} }
      @keyframes glitchC { 0%,88.9%,94%,96%,100% {opacity:0;transform:none}
                           89%  {opacity:.8;transform:translate(-5px,0)}
                           90.5%{opacity:.8;transform:translate(4px,-2px)}
                           92%  {opacity:.65;transform:translate(-3px,1px)}
                           94.8%{opacity:.7;transform:translate(3px,0)} }
      @keyframes glitchM { 0%,88.9%,94%,96%,100% {opacity:0;transform:none}
                           89%  {opacity:.8;transform:translate(5px,1px)}
                           90.5%{opacity:.8;transform:translate(-4px,2px)}
                           92%  {opacity:.65;transform:translate(3px,-1px)}
                           94.8%{opacity:.7;transform:translate(-3px,0)} }
      @keyframes rise    { 0% {transform:translateY(0);opacity:0} 12% {opacity:.85} 80% {opacity:.5} 100% {transform:translateY(-330px);opacity:0} }
    ]]></style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#microgrid)"/>
  <rect width="1200" height="320" fill="url(#glowCyan)"/>
  <rect width="1200" height="320" fill="url(#glowMag)"/>

  <!-- synthwave floor -->
  <g stroke="#1E2B4A" stroke-width="1" opacity="0.85">
    <line x1="600" y1="206" x2="-360" y2="320"/>
    <line x1="600" y1="206" x2="-80"  y2="320"/>
    <line x1="600" y1="206" x2="200"  y2="320"/>
    <line x1="600" y1="206" x2="440"  y2="320"/>
    <line x1="600" y1="206" x2="600"  y2="320"/>
    <line x1="600" y1="206" x2="760"  y2="320"/>
    <line x1="600" y1="206" x2="1000" y2="320"/>
    <line x1="600" y1="206" x2="1280" y2="320"/>
    <line x1="600" y1="206" x2="1560" y2="320"/>
  </g>
  <g stroke="#16223C" stroke-width="1">
    <line x1="0" y1="212" x2="1200" y2="212" stroke-opacity="0.9"/>
    <line x1="0" y1="220" x2="1200" y2="220" stroke-opacity="0.8"/>
    <line x1="0" y1="230" x2="1200" y2="230" stroke-opacity="0.7"/>
    <line x1="0" y1="243" x2="1200" y2="243" stroke-opacity="0.6"/>
    <line x1="0" y1="259" x2="1200" y2="259" stroke-opacity="0.5"/>
    <line x1="0" y1="279" x2="1200" y2="279" stroke-opacity="0.4"/>
    <line x1="0" y1="302" x2="1200" y2="302" stroke-opacity="0.3"/>
  </g>
  <line x1="0" y1="206" x2="1200" y2="206" stroke="#00F5FF" stroke-opacity="0.22" stroke-width="1.5"/>
  <g clip-path="url(#frameClip)">
    <rect class="floorln" x="0" y="207" width="1200" height="2" fill="#00F5FF" opacity="0"/>
  </g>

  <!-- rising particles -->
  <g>
    <circle class="pt" cx="60"   cy="312" r="2.2" fill="#00F5FF" style="animation-duration:9s;animation-delay:-1.2s"/>
    <circle class="pt" cx="140"  cy="325" r="1.6" fill="#FF00FF" style="animation-duration:12s;animation-delay:-4s"/>
    <circle class="pt" cx="230"  cy="318" r="2.8" fill="#00F5FF" style="animation-duration:11s;animation-delay:-7s"/>
    <circle class="pt" cx="310"  cy="330" r="1.8" fill="#FFD700" style="animation-duration:14s;animation-delay:-2.5s"/>
    <circle class="pt" cx="420"  cy="315" r="2.4" fill="#39FF14" style="animation-duration:10s;animation-delay:-5.5s"/>
    <circle class="pt" cx="510"  cy="328" r="1.5" fill="#00F5FF" style="animation-duration:13s;animation-delay:-8s"/>
    <circle class="pt" cx="610"  cy="316" r="2.6" fill="#FF00FF" style="animation-duration:9.5s;animation-delay:-3s"/>
    <circle class="pt" cx="700"  cy="326" r="1.7" fill="#00F5FF" style="animation-duration:12.5s;animation-delay:-6s"/>
    <circle class="pt" cx="790"  cy="314" r="2.1" fill="#FFD700" style="animation-duration:10.5s;animation-delay:-0.8s"/>
    <circle class="pt" cx="880"  cy="330" r="1.6" fill="#00F5FF" style="animation-duration:13.5s;animation-delay:-9s"/>
    <circle class="pt" cx="960"  cy="318" r="2.5" fill="#FF00FF" style="animation-duration:8.5s;animation-delay:-4.4s"/>
    <circle class="pt" cx="1050" cy="326" r="1.8" fill="#39FF14" style="animation-duration:11.5s;animation-delay:-6.7s"/>
    <circle class="pt" cx="1130" cy="312" r="2.2" fill="#00F5FF" style="animation-duration:9.8s;animation-delay:-2.2s"/>
    <circle class="pt" cx="185"  cy="322" r="1.4" fill="#00F5FF" style="animation-duration:15s;animation-delay:-10s"/>
    <circle class="pt" cx="660"  cy="328" r="1.4" fill="#FF00FF" style="animation-duration:14.5s;animation-delay:-11s"/>
  </g>

  <!-- corner HUD brackets -->
  <g stroke="#00F5FF" stroke-width="2" fill="none" opacity="0.55">
    <path d="M16 34 V16 H34"/>
    <path d="M1166 16 H1184 V34"/>
    <path d="M16 286 V304 H34"/>
    <path d="M1166 304 H1184 V286"/>
  </g>

  <!-- top system bar -->
  <text class="mono" x="70" y="33" font-size="11" fill="#4E5A6E" letter-spacing="2">SYS://MANIK.DEV — NIGHT SESSION · EST. 2024</text>
  <text class="mono" x="1130" y="33" font-size="11" fill="#4E5A6E" letter-spacing="2" text-anchor="end">PROC ▮▮▮▮▮▮▮▮▮░ 89%</text>

  <!-- boot tag -->
  <text class="mono" x="70" y="72" font-size="13" fill="#00F5FF" letter-spacing="3" opacity="0.9">// INITIALIZING PROFILE — BUILD 2026.10</text>

  <!-- name stack -->
  <g>
    <text class="sans" x="70" y="150" font-size="57" font-weight="800" letter-spacing="5" fill="#00F5FF" filter="url(#nameGlow)"><tspan class="breathe">MANIKARAJ ANBURAJ</tspan></text>
    <text class="sans gc" x="70" y="150" font-size="57" font-weight="800" letter-spacing="5" fill="#00F5FF" opacity="0">MANIKARAJ ANBURAJ</text>
    <text class="sans gm" x="70" y="150" font-size="57" font-weight="800" letter-spacing="5" fill="#FF00FF" opacity="0">MANIKARAJ ANBURAJ</text>
    <text class="sans" x="70" y="150" font-size="57" font-weight="800" letter-spacing="5" fill="url(#nameGrad)">MANIKARAJ ANBURAJ</text>
  </g>

  <!-- animated divider -->
  <rect x="70" y="169" width="630" height="2.5" rx="1.25" fill="url(#lineGrad)" opacity="0.9"/>
  <g>
    <circle class="dotrun" cx="70" cy="170.2" r="4" fill="#00F5FF" filter="url(#dotGlow)"/>
    <circle class="dotrun" cx="70" cy="170.2" r="2" fill="#FFFFFF"/>
  </g>

  <!-- subtitle -->
  <text class="mono" x="70" y="204" font-size="14.5" fill="#7FE9FF" letter-spacing="3.5">GAME DEVELOPER  //  FULL-STACK ENGINEER  //  CONTENT CREATOR</text>

  <!-- status line -->
  <g class="mono">
    <text x="70" y="243" font-size="12.5" fill="#39FF14" letter-spacing="1">&gt; DEPLOYING: "67_NIGHTS_IN_THE_FOREST"</text>
    <text x="412" y="243" font-size="12.5" fill="#39FF14" opacity="0.9" letter-spacing="1">— [████████████████░░░░] 82%</text>
    <rect class="blink" x="646" y="231" width="8" height="15" fill="#39FF14" opacity="0.9"/>
  </g>

  <!-- right HUD panel -->
  <g>
    <rect x="845" y="55" width="300" height="200" rx="12" fill="#0A0E1A" fill-opacity="0.78" stroke="#1F2A37" stroke-width="1.2"/>
    <rect x="845" y="55" width="300" height="3" rx="1.5" fill="url(#edgeGrad)" opacity="0.8"/>
    <circle cx="878" cy="88" r="15" fill="none" stroke="#1F2A37" stroke-width="3"/>
    <circle class="spin" cx="878" cy="88" r="15" fill="none" stroke="#00F5FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="28 66"/>
    <text class="mono" x="904" y="93" font-size="13" font-weight="700" fill="#00F5FF" letter-spacing="2.5">PLAYER.CARD</text>
    <line x1="868" y1="106" x2="1122" y2="106" stroke="#1F2A37" stroke-width="1"/>

    <text class="mono" x="868" y="128" font-size="11" fill="#5C6773" letter-spacing="1.5">CLASS</text>
    <text class="mono" x="1122" y="128" font-size="12" fill="#C9D1D9" text-anchor="end">GAME_DEV ++ WEB</text>

    <text class="mono" x="868" y="153" font-size="11" fill="#5C6773" letter-spacing="1.5">ENGINES</text>
    <text class="mono" x="1122" y="153" font-size="12" fill="#C9D1D9" text-anchor="end">RBX · UNITY · UE5</text>

    <text class="mono" x="868" y="178" font-size="11" fill="#5C6773" letter-spacing="1.5">STACK</text>
    <text class="mono" x="1122" y="178" font-size="12" fill="#C9D1D9" text-anchor="end">LUAU · TS · PY</text>

    <text class="mono" x="868" y="203" font-size="11" fill="#5C6773" letter-spacing="1.5">STATUS</text>
    <circle class="pulse" cx="1062" cy="199" r="4" fill="#39FF14" filter="url(#softGlow)"/>
    <text class="mono" x="1122" y="203" font-size="12" fill="#39FF14" text-anchor="end">ONLINE</text>

    <text class="mono" x="868" y="227" font-size="11" fill="#5C6773" letter-spacing="1.5">XP</text>
    <rect x="895" y="218" width="227" height="8" rx="4" fill="#121A2B" stroke="#1F2A37" stroke-width="1"/>
    <rect class="xpfill" x="895" y="218" width="227" height="8" rx="4" fill="url(#xpGrad)"/>

    <text class="mono" x="995" y="247" font-size="10.5" fill="#FFD700" letter-spacing="1.5" text-anchor="middle">EST. 2024 · 2× HACKATHON WINNER</text>
  </g>

  <!-- light sweep across the whole card -->
  <g clip-path="url(#frameClip)">
    <rect class="sweep" x="0" y="0" width="150" height="320" fill="url(#sweepGrad)"/>
  </g>

  <!-- CRT scanline -->
  <g clip-path="url(#frameClip)">
    <rect class="scan" x="0" y="0" width="1200" height="10" fill="url(#scanGrad)" opacity="0"/>
  </g>

  <!-- vignette + bottom edge -->
  <rect width="1200" height="320" fill="url(#vignette)"/>
  <rect x="0" y="317.5" width="1200" height="2.5" fill="url(#edgeGrad)"/>
</svg>
