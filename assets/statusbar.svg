<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84">
  <defs>
    <linearGradient id="sedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0.05"/>
    </linearGradient>
    <style><![CDATA[
      .mono { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .vscan { animation: vscan 9s ease-in-out infinite; }
      .run   { animation: run 8s linear infinite; }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
      @keyframes vscan { 0% {transform:translateX(0);opacity:0} 8% {opacity:.22} 55% {transform:translateX(1140px);opacity:.22} 65%,100% {transform:translateX(1140px);opacity:0} }
      @keyframes run   { 0% {transform:translateX(-8px);opacity:0} 12% {opacity:.8} 88% {opacity:.8} 100% {transform:translateX(1170px);opacity:0} }
    ]]></style>
    <filter id="sglow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="10" y="10" width="1180" height="64" rx="10" fill="#070A12" stroke="#1F2A37" stroke-width="1"/>
  <rect x="10" y="10" width="1180" height="2" rx="1" fill="url(#sedge)" opacity="0.8"/>
  <g stroke="#2A3A54" stroke-width="1.4" fill="none" opacity="0.9">
    <path d="M18 26 V18 H26"/>
    <path d="M1174 18 H1182 V26"/>
    <path d="M18 58 V66 H26"/>
    <path d="M1174 66 H1182 V58"/>
  </g>

  <!-- prompt -->
  <text class="mono" x="36" y="48" font-size="14" font-weight="700" fill="#00F5FF">manik@dev</text>
  <text class="mono" x="128" y="48" font-size="14" fill="#3A4A63">:~$</text>
  <rect class="blink" x="272" y="38" width="7" height="15" fill="#00F5FF" opacity="0.9"/>

  <!-- metric chips -->
  <!-- eye icon -->
  <g>
    <rect x="230" y="20" width="190" height="44" rx="7" fill="#0A0E1A" stroke="#233146" stroke-width="1"/>
    <rect x="230" y="20" width="2.5" height="44" rx="1.25" fill="#00F5FF" opacity="0.55"/>
    <text class="mono" x="250" y="38" font-size="10" fill="#5C6773" letter-spacing="1.8">VIEWS</text>
    <g transform="translate(392,29) scale(1.05)" fill="none" stroke="#00F5FF" stroke-width="1.3" opacity="0.8">
      <path d="M1 5.5 C3.5 2 9 2 11 5.5 C9 9 3.5 9 1 5.5 Z"/>
      <circle cx="6" cy="5.5" r="1.5" fill="#00F5FF" stroke="none"/>
    </g>
    <text class="mono" x="250" y="59" font-size="18" font-weight="700" fill="#00F5FF">8</text>
  </g>
  <!-- person icon -->
  <g>
    <rect x="440" y="20" width="190" height="44" rx="7" fill="#0A0E1A" stroke="#233146" stroke-width="1"/>
    <rect x="440" y="20" width="2.5" height="44" rx="1.25" fill="#FF6CF0" opacity="0.55"/>
    <text class="mono" x="460" y="38" font-size="10" fill="#5C6773" letter-spacing="1.8">FOLLOWERS</text>
    <g transform="translate(602,28) scale(1.05)" fill="none" stroke="#FF6CF0" stroke-width="1.3" opacity="0.8">
      <circle cx="6" cy="3.4" r="2.4"/>
      <path d="M1.5 11 C1.5 7.6 4 6.6 6 6.6 C8 6.6 10.5 7.6 10.5 11"/>
    </g>
    <text class="mono" x="460" y="59" font-size="18" font-weight="700" fill="#FF6CF0">38</text>
  </g>
  <!-- star icon -->
  <g>
    <rect x="650" y="20" width="190" height="44" rx="7" fill="#0A0E1A" stroke="#233146" stroke-width="1"/>
    <rect x="650" y="20" width="2.5" height="44" rx="1.25" fill="#FFD700" opacity="0.55"/>
    <text class="mono" x="670" y="38" font-size="10" fill="#5C6773" letter-spacing="1.8">STARS</text>
    <path transform="translate(812,28) scale(1.05)" d="M6 .8 L7.5 4.4 L11.4 4.6 L8.4 7.1 L9.3 10.9 L6 8.7 L2.7 10.9 L3.6 7.1 L.6 4.6 L4.5 4.4 Z" fill="none" stroke="#FFD700" stroke-width="1.1" opacity="0.8"/>
    <text class="mono" x="670" y="59" font-size="18" font-weight="700" fill="#FFD700">0</text>
  </g>
  <!-- cube icon -->
  <g>
    <rect x="860" y="20" width="190" height="44" rx="7" fill="#0A0E1A" stroke="#233146" stroke-width="1"/>
    <rect x="860" y="20" width="2.5" height="44" rx="1.25" fill="#00F5FF" opacity="0.55"/>
    <text class="mono" x="880" y="38" font-size="10" fill="#5C6773" letter-spacing="1.8">REPOS</text>
    <g transform="translate(1022,28) scale(1.05)" fill="none" stroke="#00F5FF" stroke-width="1.2" opacity="0.8">
      <path d="M6 .8 L11 3.4 L11 8.6 L6 11.2 L1 8.6 L1 3.4 Z"/>
      <path d="M1 3.4 L6 6 L11 3.4 M6 6 L6 11.2"/>
    </g>
    <text class="mono" x="880" y="59" font-size="18" font-weight="700" fill="#00F5FF">37</text>
  </g>

  <!-- status pill -->
  <rect x="1062" y="26" width="114" height="32" rx="15" fill="url(#pill)" stroke="#39FF14" stroke-opacity="0.4" stroke-width="1"/>
  <circle class="pulse" cx="1080" cy="42" r="4" fill="#39FF14" filter="url(#sglow)"/>
  <text class="mono" x="1092" y="46.5" font-size="10.5" font-weight="600" fill="#39FF14" letter-spacing="0.4">OPEN TO WORK</text>


  <!-- ambient motion -->
  <rect class="vscan" x="14" y="14" width="2" height="56" fill="#00F5FF" opacity="0"/>
  <circle class="run" cx="12" cy="11" r="2.4" fill="#00F5FF" filter="url(#sglow)"/>
</svg>
