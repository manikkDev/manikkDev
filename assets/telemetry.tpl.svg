<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330">
  <defs>
    <linearGradient id="tedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tglow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style><![CDATA[
      .mono  { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .boot  { animation: boot .5s ease-out backwards; }
      .seg   { animation: seg .45s cubic-bezier(.2,.8,.3,1) backwards; transform-box: fill-box; transform-origin: left center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .flame { animation: flame 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .run   { animation: run 8s linear infinite; }
      @keyframes boot  { 0% {opacity:0;transform:translateY(6px)} 100% {opacity:1;transform:translateY(0)} }
      @keyframes seg   { 0% {opacity:0;transform:scaleX(0)} 100% {opacity:1;transform:scaleX(1)} }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
      @keyframes flame { 0%,100% {transform:scale(1)} 50% {transform:scale(1.25)} }
      @keyframes run   { 0% {transform:translateX(-8px);opacity:0} 12% {opacity:.9} 88% {opacity:.9} 100% {transform:translateX(900px);opacity:0} }
    ]]></style>
  </defs>

  <rect x="8" y="8" width="924" height="314" rx="12" fill="#070A12" stroke="#1F2A37" stroke-width="1"/>
  <rect x="8" y="8" width="924" height="2" rx="1" fill="url(#tedge)" opacity="0.8"/>
  <g stroke="#2A3A54" stroke-width="1.4" fill="none" opacity="0.9">
    <path d="M15 23 V15 H23"/><path d="M917 15 H925 V23"/>
    <path d="M15 307 V315 H23"/><path d="M917 315 H925 V307"/>
  </g>

  <text class="mono" x="26" y="38" font-size="12" fill="#5C6773" letter-spacing="3">TELEMETRY.SYS</text>
  <text class="mono" x="152" y="38" font-size="12" fill="#00F5FF" letter-spacing="3">//</text>
  <text class="mono" x="176" y="38" font-size="12" fill="#C9D1D9" letter-spacing="2.5">LIVE_METRICS</text>
  <text class="mono" x="886" y="38" font-size="11" fill="#5C6773" letter-spacing="1.5" text-anchor="end">AUTO-SYNC DAILY · __SYNC__</text>
  <circle class="pulse" cx="910" cy="34" r="3" fill="#39FF14"/>
  <line x1="20" y1="50" x2="920" y2="50" stroke="#1F2A37" stroke-width="1"/>

  <!-- ============ MODULE A: combat stats ============ -->
  <g class="boot">
    <rect x="20" y="60" width="292" height="252" rx="10" fill="#0A0E1A" stroke="#1F2A37"/>
    <rect x="20" y="60" width="292" height="2" rx="1" fill="#00F5FF" opacity="0.55"/>
    <g stroke="#00F5FF" stroke-width="1.3" fill="none" opacity="0.85">
      <path d="M28 76 V68 H36"/><path d="M296 68 H304 V76"/>
    </g>
    <rect x="34" y="80" width="4" height="13" rx="1" fill="#00F5FF"/>
    <text class="mono" x="46" y="91" font-size="12" fill="#E6EDF3" letter-spacing="2" font-weight="600">COMBAT.STATS</text>
    <text class="mono" x="296" y="91" font-size="10" fill="#5C6773" text-anchor="end">ALL_TIME</text>
__COMBAT_ROWS__
  </g>

  <!-- ============ MODULE B: engagement ============ -->
  <g class="boot" style="animation-delay:.15s">
    <rect x="328" y="60" width="292" height="252" rx="10" fill="#0A0E1A" stroke="#1F2A37"/>
    <rect x="328" y="60" width="292" height="2" rx="1" fill="#FF6CF0" opacity="0.55"/>
    <g stroke="#FF6CF0" stroke-width="1.3" fill="none" opacity="0.85">
      <path d="M336 76 V68 H344"/><path d="M604 68 H612 V76"/>
    </g>
    <rect x="342" y="80" width="4" height="13" rx="1" fill="#FF6CF0"/>
    <text class="mono" x="354" y="91" font-size="12" fill="#E6EDF3" letter-spacing="2" font-weight="600">ENGAGEMENT</text>
    <text class="mono" x="604" y="91" font-size="10" fill="#5C6773" text-anchor="end">CONTRIB</text>

    <text class="mono" x="474" y="128" font-size="32" font-weight="800" fill="#00F5FF" text-anchor="middle">__TOTAL__</text>
    <text class="mono" x="474" y="148" font-size="10.5" fill="#93A4BC" letter-spacing="1.5" text-anchor="middle">TOTAL CONTRIBUTIONS · SINCE __SINCE__</text>

    <circle cx="474" cy="200" r="36" fill="none" stroke="#16233A" stroke-width="6"/>
    <circle cx="474" cy="200" r="36" fill="none" stroke="#FF6CF0" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="__RING_LEN__ 226.2" transform="rotate(-90 474 200)"/>
    <circle class="flame" cx="474" cy="164" r="4" fill="#FFD700" filter="url(#tglow)"/>
    <text class="mono" x="474" y="208" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">__CUR__</text>
    <text class="mono" x="474" y="256" font-size="10" fill="#FF6CF0" letter-spacing="2" text-anchor="middle">CURRENT STREAK</text>

    <text class="mono" x="474" y="280" font-size="11.5" fill="#C9D1D9" text-anchor="middle">LONGEST <tspan fill="#00F5FF" font-weight="700">__LONG__</tspan> DAYS · __LONGDATES__</text>

    <text class="mono" x="346" y="300" font-size="9" fill="#5C6773" letter-spacing="1.5">LAST_26_WEEKS</text>
__SPARK__
  </g>

  <!-- ============ MODULE C: language loadout ============ -->
  <g class="boot" style="animation-delay:.3s">
    <rect x="636" y="60" width="288" height="252" rx="10" fill="#0A0E1A" stroke="#1F2A37"/>
    <rect x="636" y="60" width="288" height="2" rx="1" fill="#FFD700" opacity="0.55"/>
    <g stroke="#FFD700" stroke-width="1.3" fill="none" opacity="0.85">
      <path d="M644 76 V68 H652"/><path d="M908 68 H916 V76"/>
    </g>
    <rect x="650" y="80" width="4" height="13" rx="1" fill="#FFD700"/>
    <text class="mono" x="662" y="91" font-size="12" fill="#E6EDF3" letter-spacing="2" font-weight="600">LANGUAGE.LOADOUT</text>
    <text class="mono" x="908" y="91" font-size="10" fill="#5C6773" text-anchor="end">TOP_6</text>
__LANG_ROWS__
  </g>

  <circle class="run" cx="10" cy="9" r="2.2" fill="#00F5FF" filter="url(#tglow)"/>
</svg>
