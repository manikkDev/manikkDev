<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64">
  <defs>
    <style><![CDATA[
      .mono { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .clip1,.clip2,.clip3,.clip4 { transform-origin: 60px 0; animation: type 20s infinite; }
      .clip2 { animation-delay: -5s; }
      .clip3 { animation-delay: -10s; }
      .clip4 { animation-delay: -15s; }
      .vis1,.vis2,.vis3,.vis4 { animation: vis 20s infinite; opacity: 0; }
      .vis2 { animation-delay: -5s; }
      .vis3 { animation-delay: -10s; }
      .vis4 { animation-delay: -15s; }
      .cur1,.cur2,.cur3,.cur4 { animation-duration: 20s, 1.1s; animation-iteration-count: infinite, infinite; }
      .cur1 { animation-name: cur1, blink; animation-timing-function: steps(50), steps(1); }
      .cur2 { animation-name: cur2, blink; animation-delay: -5s, -5s; animation-timing-function: steps(46), steps(1); }
      .cur3 { animation-name: cur3, blink; animation-delay: -10s, -10s; animation-timing-function: steps(48), steps(1); }
      .cur4 { animation-name: cur4, blink; animation-delay: -15s, -15s; animation-timing-function: steps(46), steps(1); }
      @keyframes type { 0% {transform:scaleX(0)} 9% {transform:scaleX(1)} 18% {transform:scaleX(1)} 22.4% {transform:scaleX(0)} 22.5%,100% {transform:scaleX(0)} }
      @keyframes vis  { 0% {opacity:1} 22.4% {opacity:1} 22.5%,100% {opacity:0} }
      @keyframes cur1 { 0% {transform:translateX(0)} 9% {transform:translateX(580px)} 22.5%,100% {transform:translateX(580px)} }
      @keyframes cur2 { 0% {transform:translateX(0)} 9% {transform:translateX(534px)} 22.5%,100% {transform:translateX(534px)} }
      @keyframes cur3 { 0% {transform:translateX(0)} 9% {transform:translateX(557px)} 22.5%,100% {transform:translateX(557px)} }
      @keyframes cur4 { 0% {transform:translateX(0)} 9% {transform:translateX(534px)} 22.5%,100% {transform:translateX(534px)} }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
    ]]></style>
    <clipPath id="c1"><rect class="clip1" x="60" y="0" width="760" height="64"/></clipPath>
    <clipPath id="c2"><rect class="clip2" x="60" y="0" width="760" height="64"/></clipPath>
    <clipPath id="c3"><rect class="clip3" x="60" y="0" width="760" height="64"/></clipPath>
    <clipPath id="c4"><rect class="clip4" x="60" y="0" width="760" height="64"/></clipPath>
  </defs>

  <!-- left accent -->
  <rect x="0" y="14" width="4" height="36" rx="2" fill="#00F5FF" opacity="0.9"/>
  <text class="mono" x="28" y="42" font-size="20" font-weight="700" fill="#FF00FF">&gt;_</text>

  <!-- line 1 -->
  <g class="vis1">
    <text class="mono" x="60" y="42" font-size="20" font-weight="600" fill="#7FE9FF" letter-spacing="1" clip-path="url(#c1)">Building worlds in Roblox, Unity and Unreal Engine</text>
    <rect class="cur1" x="64" y="24" width="11" height="24" fill="#00F5FF"/>
  </g>
  <!-- line 2 -->
  <g class="vis2">
    <text class="mono" x="60" y="42" font-size="20" font-weight="600" fill="#7FE9FF" letter-spacing="1" clip-path="url(#c2)">Shipping MERN + TypeScript products end-to-end</text>
    <rect class="cur2" x="64" y="24" width="11" height="24" fill="#00F5FF"/>
  </g>
  <!-- line 3 -->
  <g class="vis3">
    <text class="mono" x="60" y="42" font-size="20" font-weight="600" fill="#7FE9FF" letter-spacing="1" clip-path="url(#c3)">2x Hackathon Winner · B.E. Computer Engineering</text>
    <rect class="cur3" x="64" y="24" width="11" height="24" fill="#00F5FF"/>
  </g>
  <!-- line 4 -->
  <g class="vis4">
    <text class="mono" x="60" y="42" font-size="20" font-weight="600" fill="#7FE9FF" letter-spacing="1" clip-path="url(#c4)">Turning ideas into playable, shippable systems</text>
    <rect class="cur4" x="64" y="24" width="11" height="24" fill="#00F5FF"/>
  </g>
</svg>
