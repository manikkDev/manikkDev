<svg xmlns="http://www.w3.org/2000/svg" width="176" height="42" viewBox="0 0 176 42">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD700" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <style><![CDATA[
      .mono { font-family:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .run  { animation: run 7s linear infinite; }
      .pulse{ animation: pulse 2.4s ease-in-out infinite; }
      @keyframes run   { 0% {transform:translateX(-8px);opacity:0} 12% {opacity:.9} 88% {opacity:.9} 100% {transform:translateX(168px);opacity:0} }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.25} }
    ]]></style>
  </defs>
  <rect x="1.5" y="5.5" width="173" height="32" rx="7" fill="#0A0E1A" fill-opacity="0.9" stroke="#1F2A37" stroke-width="1"/>
  <rect x="1.5" y="5.5" width="173" height="2" rx="1" fill="url(#edge)" opacity="0.55"/>
  <rect x="11" y="12" width="20" height="19" rx="4" fill="#FFD700" fill-opacity="0.12" stroke="#FFD700" stroke-opacity="0.6" stroke-width="1"/>
  <text class="mono" x="21" y="26.5" font-size="11" font-weight="700" fill="#FFD700" text-anchor="middle">03</text>
  <text class="mono" x="41" y="26.5" font-size="11.5" fill="#E6EDF3" letter-spacing="1.5" font-weight="600">PROJECTS</text>
  <circle class="run" cx="6" cy="6.5" r="2.2" fill="#FFD700" filter="url(#glow)" style="animation-delay:-2.2s"/>
</svg>