<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060C"/>
      <stop offset="1" stop-color="#080615"/>
    </linearGradient>
    <linearGradient id="fedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      .mono { font-family: 'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .run   { animation: run 6s linear infinite; }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes run   { 0% {transform:translateX(-90px)} 100% {transform:translateX(1290px)} }
    ]]></style>
    <filter id="fdot" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="150" fill="url(#fbg)"/>
  <rect width="1200" height="150" fill="url(#fglow)"/>
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#fedge)"/>

  <g>
    <circle class="run" cx="0" cy="1.2" r="4" fill="#00F5FF" filter="url(#fdot)"/>
    <circle class="run" cx="0" cy="1.2" r="1.8" fill="#FFFFFF"/>
  </g>

  <text class="mono" x="600" y="72" font-size="16" fill="#C9D1D9" letter-spacing="4" text-anchor="middle">STAY CURIOUS · SHIP OFTEN</text>

  <g class="mono">
    <text x="600" y="104" font-size="12" fill="#4E5A6E" letter-spacing="2" text-anchor="middle">manik@dev ~ exit 0</text>
    <rect class="blink" x="710" y="93" width="8" height="14" fill="#39FF14" opacity="0.9"/>
  </g>

  <g stroke="#00F5FF" stroke-width="2" fill="none" opacity="0.55">
    <path d="M16 40 V22 H34"/>
    <path d="M1166 22 H1184 V40"/>
    <path d="M16 110 V128 H34"/>
    <path d="M1166 128 H1184 V110"/>
  </g>
</svg>
